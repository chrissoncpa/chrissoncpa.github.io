<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Chris Son</title>
<meta name="description" content="That page doesn't exist. Head back to chrissoncpa.github.io.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/logo-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png">
<link rel="stylesheet" href="/styles.css?v=5">

<script>
  (function () {
    try {
      var stored = localStorage.getItem('theme');
      if (stored === 'dark' || (stored === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (e) {}
  })();
</script>

<style>
  .nf {
    min-height: 100vh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 24px;
  }
  .nf-code {
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 18px;
  }
  .nf h1 {
    font-size: clamp(30px, 6vw, 46px);
    margin-bottom: 14px;
  }
  .nf p {
    color: var(--text-muted);
    max-width: 46ch;
    margin: 0 auto 28px;
  }
</style>
</head>
<body>
  <main class="nf">
    <div>
      <p class="nf-code">Error 404</p>
      <h1>This page doesn&rsquo;t exist.</h1>
      <p>The link may be out of date, or the page may have moved. Everything lives on one page here.</p>
      <a class="btn btn-primary" href="/">Back to the homepage</a>
    </div>
  </main>
</body>
</html>
